name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            pkg: jsv-linux-x64
            binary: jsv
          - target: aarch64-linux-musl
            pkg: jsv-linux-arm64
            binary: jsv
          - target: x86_64-macos
            pkg: jsv-darwin-x64
            binary: jsv
          - target: aarch64-macos
            pkg: jsv-darwin-arm64
            binary: jsv
          - target: x86_64-windows
            pkg: jsv-win32-x64
            binary: jsv.exe
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe -Dstrip=true -Dtarget=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: zig-out/bin/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check version matches tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for manifest in packages/*/package.json; do
            test "$(jq -r .version $manifest)" = "$VERSION" || { echo "$manifest is not $VERSION"; exit 1; }
          done
      - name: Stage binaries
        run: |
          for pkg in jsv-linux-x64 jsv-linux-arm64 jsv-darwin-x64 jsv-darwin-arm64; do
            mkdir -p packages/$pkg/bin
            cp artifacts/$pkg/jsv packages/$pkg/bin/jsv
            chmod +x packages/$pkg/bin/jsv
          done
          mkdir -p packages/jsv-win32-x64/bin
          cp artifacts/jsv-win32-x64/jsv.exe packages/jsv-win32-x64/bin/jsv.exe
      - name: Publish
        run: pnpm -r publish --access public --provenance --no-git-checks
